name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        flags: [""]
        go:
          - "oldstable"
          - "stable"
        arch:
          - amd64
        runner:
          - ubuntu-latest
        include:
          # macOS is temporarily disabled: since 2026-11-10 every macos-latest
          # job hangs in compile until the job timeout. Re-enable once fixed.
          #
          # macos-latest is Apple Silicon: test natively, as amd64 runs under
          # Rosetta and takes hours.
          # - arch: arm64
          #   go: "oldstable"
          #   runner: macos-latest
          # - arch: arm64
          #   go: "stable"
          #   runner: macos-latest

          - arch: amd64
            runner: windows-latest
            go: "stable"
            flags: "-p=1"

          - arch: amd64
            go: "stable"
            runner: ubuntu-latest
            flags: "-race"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Get Go environment
        id: go-env
        run: |
          echo "::set-output name=cache::$(go env GOCACHE)"
          echo "::set-output name=modcache::$(go env GOMODCACHE)"
      - name: Set up cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: test-${{ runner.os }}-${{ matrix.arch }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.arch }}-go-${{ matrix.go }}-

      - name: Run tests
        env:
          GOARCH: ${{ matrix.arch }}
          GOFLAGS: ${{ matrix.flags }}
        run: go test --timeout 5m ./...
